name: Documentation / ドキュメント
description: Report a documentation issue or suggest an improvement / ドキュメントの不具合や改善を報告
title: "[Docs]: "
labels:
  - "documentation / ドキュメント"
  - "triage / 初期確認"
body:
  - type: textarea
    id: location
    attributes:
      label: Location / 対象箇所
      description: Link to the page or file, if available. / 分かる場合は対象ページやファイルへのリンクを記載してください。
    validations:
      required: false

  - type: textarea
    id: issue
    attributes:
      label: Issue / 問題点
      description: What is unclear, incorrect, or missing? / 不明瞭・不正確・不足している内容を記載してください。
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion / 改善案
      description: Describe the proposed change, if any. / 改善案があれば記載してください。
    validations:
      required: false
